name: Deploy Kitia catalog site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "catalogs/**"
      - "bin/**"
      - "src/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-site.js"
      - "scripts/build-source-catalogs.js"
      - "scripts/generate-catalog.js"
      - "catalogs/catalogSources.json"
      - "site/**"
      - "tsconfig.json"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 2 AM

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run catalog:build
      - run: npm run site:build
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - run: npm run validate
        env:
          KITIA_SOURCE_CATALOGS: site-build/data/source-catalogs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish source catalogs for the CLI
        uses: actions/upload-artifact@v4
        with:
          name: source-catalogs
          path: site-build/data/source-catalogs/*.json
          if-no-files-found: error
          retention-days: 90
