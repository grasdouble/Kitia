name: Release to npm

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run cli:validate
      - run: pnpm run cli:test:package-smoke
      - name: Create version PR or publish
        uses: grasdouble/Lufa-CICD/actions/changesets-release@4d341814e051c0f528b4ffc5537dd7ec13e85963 # changesets-release-v2.0.0
        with:
          version-command: pnpm run changeset:version
          publish-command: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: "true"
          release-token: ${{ secrets.GITHUB_TOKEN }}
