name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: grasdouble/Lufa-CICD/actions/lint-workflows@ec9d4b984b5bc24c062c57b50d754f6edc383c11 # lint-workflows-v1
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run cli:validate
      - run: pnpm run cli:test:package-smoke
      - run: pnpm run web:build

  # Simple mode checks Kitia's root package and honors empty no-bump Changesets.
  changeset-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Changesets coverage
        id: changesets
        uses: grasdouble/Lufa-CICD/actions/check-changesets@e6b2f080ba3bd5d7b8c7140e21623ac06388a245 # check-changesets-v1.1.2
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          mode: simple
      - name: Fail when Changesets are missing
        if: steps.changesets.outputs.missing-count > 0
        run: exit 1
